name: Zesty Sync Preview

# On PRs into stage/production, show in one PR comment what merging will deploy:
# added/updated for stage, published dev→live for production. Read-only.
# The script that runs is the TARGET branch's copy, never the PR's, so a PR
# can't change the code that runs with the Zesty token.
on:
  pull_request:
    branches: [stage, production]
    types: [opened, synchronize, reopened]

concurrency:
  group: zesty-sync-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  SYNC_SCRIPT: scripts/sync-to-zesty.js
  REPORT_FILE: zesty-report.md
  REPORT_MARKER: '<!-- zesty-sync-report -->'

jobs:
  preview:
    # Fork PRs get no secrets and a read-only token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the merge result
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: site
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the sync script from the target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # HEAD is the merge commit and HEAD^1 the target branch, so the diff is exactly
      # what the deploy will see after the merge.
      - name: Analyze sync impact (read-only)
        id: analyze
        working-directory: site
        env:
          ZESTY_INSTANCE_ZUID: ${{ secrets.ZESTY_INSTANCE_ZUID }}
          # Prefer a read-only token; falls back to the deploy token until one is added.
          ZESTY_DEVELOPER_TOKEN: ${{ secrets.ZESTY_READONLY_TOKEN || secrets.ZESTY_DEVELOPER_TOKEN }}
          REPORT: 'true'
          BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          rm -f "$REPORT_FILE"
          git diff --quiet HEAD^1 HEAD -- "$SYNC_SCRIPT" || echo "script_changed=true" >> "$GITHUB_OUTPUT"
          DIFF_BASE="$(git rev-parse HEAD^1)" DIFF_HEAD="$(git rev-parse HEAD)" \
            node "$GITHUB_WORKSPACE/trusted/$SYNC_SCRIPT"

      # Runs even when the analysis failed, so an earlier report never looks current.
      - name: Post / update PR comment
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          SCRIPT_CHANGED: ${{ steps.analyze.outputs.script_changed }}
        with:
          script: |
            const fs = require('fs');
            const marker = process.env.REPORT_MARKER;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body = '';
            if (process.env.ANALYZE_OUTCOME === 'success') {
              try { body = fs.readFileSync(`site/${process.env.REPORT_FILE}`, 'utf8'); } catch {}
            }
            if (!body.trim()) {
              body = [
                '### ⚠️ Zesty sync preview unavailable',
                '',
                `The analysis did not produce a report (step: \`${process.env.ANALYZE_OUTCOME || 'not run'}\`). ` +
                  'Merge conflicts or a sync script error are the usual causes. ' +
                  `Don't merge on the assumption that nothing deploys. [Run log](${runUrl})`,
              ].join('\n');
            }
            if (process.env.SCRIPT_CHANGED === 'true') {
              body = `> ℹ️ This PR changes \`${process.env.SYNC_SCRIPT}\`. The preview ran the target branch's version; ` +
                'the deploy after the merge will run the new one.\n\n' + body;
            }
            const limit = 60000; // GitHub comments max out at 65,536 characters
            if (body.length > limit) {
              body = body.slice(0, limit) + `\n\n…truncated. Full list in the [run log](${runUrl}).`;
            }
            if (!body.includes(marker)) body += `\n${marker}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
