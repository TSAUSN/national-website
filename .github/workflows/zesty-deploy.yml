name: Deploy to Zesty.io

on:
  push:
    branches: [stage, production]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also publish to production (overrides branch logic)'
        required: false
        default: false
        type: boolean
      full_sync:
        description: 'Sync every mapped file instead of only changed files'
        required: false
        default: false
        type: boolean

# One deploy per branch at a time, so syncs, mapping commits and the
# zesty-synced-<branch> tags never overlap. A running deploy is never cancelled,
# but GitHub keeps only the newest pending run per group: an older queued run is
# cancelled when a newer one arrives. That's safe here because each run diffs
# from the branch's last successfully synced commit, so the newer run covers the
# skipped one.
concurrency:
  group: zesty-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Needed so the job can commit new-resource ZUID mappings back to the branch
    # and move the zesty-synced-<branch> tag.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Both branches diff from their last successfully synced commit (the
      # zesty-synced-<branch> tag), so files from a failed run are retried by the
      # next one. Falls back to the pre-push SHA when the tag doesn't exist yet.
      - name: Resolve diff base
        id: base
        env:
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          tag="refs/tags/zesty-synced-$REF_NAME"
          if git rev-parse -q --verify "$tag^{commit}" >/dev/null; then
            echo "sha=$(git rev-parse "$tag^{commit}")" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$BEFORE" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Zesty Sync & Deploy
        id: sync
        env:
          ZESTY_INSTANCE_ZUID: ${{ secrets.ZESTY_INSTANCE_ZUID }}
          ZESTY_DEVELOPER_TOKEN: ${{ secrets.ZESTY_DEVELOPER_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          FULL_SYNC: ${{ inputs.full_sync }}
          DIFF_BASE: ${{ steps.base.outputs.sha }}
        run: node scripts/sync-to-zesty.js

      # Read-only: compares git with dev (stage) or live (production) for the same
      # files the sync handled (same DIFF_BASE / FULL_SYNC). Fails only on
      # mismatches there. Runs on the pushed commit ($GITHUB_SHA) plus any mappings
      # the sync just wrote, before the mapping commit's pull --rebase can bring in
      # newer commits. Its result gates the synced tag and fails the job at the end.
      - name: Verify git matches Zesty
        id: verify
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          ZESTY_INSTANCE_ZUID: ${{ secrets.ZESTY_INSTANCE_ZUID }}
          ZESTY_DEVELOPER_TOKEN: ${{ secrets.ZESTY_DEVELOPER_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          FULL_SYNC: ${{ inputs.full_sync }}
          DIFF_BASE: ${{ steps.base.outputs.sha }}
          VERIFY: 'true'
          DRY_RUN: 'true'
        run: |
          set +e
          node scripts/sync-to-zesty.js
          rc=$?
          if [ -f zesty-verify.md ]; then cat zesty-verify.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $rc

      # Info only: every mapped file vs dev/live, so drift outside this push's
      # scope shows up on each deploy (a nightly schedule can't run: the default
      # branch is main). Never fails the job.
      - name: Drift report, all files (info)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          ZESTY_INSTANCE_ZUID: ${{ secrets.ZESTY_INSTANCE_ZUID }}
          ZESTY_DEVELOPER_TOKEN: ${{ secrets.ZESTY_DEVELOPER_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          VERIFY: 'true'
          DRY_RUN: 'true'
        run: |
          rm -f zesty-verify.md
          node scripts/sync-to-zesty.js > /dev/null 2>&1 || true
          if [ -f zesty-verify.md ]; then
            { echo '<details><summary>Drift report, all mapped files (info, not blocking)</summary>'; echo; cat zesty-verify.md; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Runs even when the sync failed, so ZUIDs of resources created before the
      # failure are never lost.
      - name: Commit new-resource ZUID mappings
        id: mappings
        if: ${{ always() }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- zesty.config.json; then
            echo "No new mappings to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zesty.config.json
          git commit -m "chore: map new Zesty resource ZUIDs [skip ci]"
          git pull --rebase origin "$REF_NAME"
          git push origin "HEAD:$REF_NAME"

      # Moves only when the sync succeeded, Verify confirmed the instance now
      # matches git for those files, AND the mappings were committed (or there were
      # none). Otherwise the next run re-diffs from the old tag and retries them.
      # zesty-synced-stage moves only on stage-mode runs (stage, no publish input);
      # zesty-synced-production only on production runs. A stage dispatch with
      # publish=true moves no tag.
      - name: Mark branch as synced
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && steps.verify.outcome == 'success' && steps.mappings.outcome == 'success' && ((github.ref_name == 'stage' && inputs.publish != true) || github.ref_name == 'production') }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git tag -f "zesty-synced-$REF_NAME" "$GITHUB_SHA"
          git push -f origin "refs/tags/zesty-synced-$REF_NAME"

      - name: Fail when Verify found mismatches
        if: ${{ !cancelled() && steps.verify.outcome == 'failure' }}
        run: |
          echo "Verify found differences between git and Zesty; see the job summary."
          exit 1
